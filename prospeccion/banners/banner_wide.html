<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap');
  :root{
    --ink:#1B1409; --parch:#F3EEE4; --selva:#162E20; --selva2:#1C3B28;
    --verde:#3A6B47; --verde-lt:#82C994; --terra:#BF5028; --oro:#C59B1C; --oro-lt:#E7C65A; --stone:#CBBBA0;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:628px;}
  .card{
    width:1200px;height:628px;position:relative;overflow:hidden;
    background:radial-gradient(120% 140% at 82% 20%, #244a33 0%, var(--selva2) 45%, var(--selva) 100%);
    font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--parch);display:flex;
  }
  .card::before{content:"";position:absolute;inset:0;opacity:.06;
    background-image:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 54px);}
  .left{position:relative;z-index:2;flex:1;padding:58px 56px;display:flex;flex-direction:column;}
  .brand{display:flex;align-items:center;gap:16px;}
  .brand .mark{width:58px;height:58px;filter:drop-shadow(0 5px 12px rgba(0,0,0,.35));}
  .brand .wm{font-family:'Fraunces','Georgia',serif;font-weight:600;font-size:30px;color:#fff;}
  .brand .wm b{color:var(--oro-lt);font-weight:700;}
  .eyebrow{margin-top:34px;font-size:17px;letter-spacing:3px;text-transform:uppercase;color:var(--oro-lt);font-weight:700;}
  .headline{margin-top:16px;font-family:'Fraunces','Georgia',serif;font-weight:600;font-size:54px;line-height:1.04;color:#fff;letter-spacing:-.5px;max-width:640px;}
  .headline em{font-style:italic;color:var(--verde-lt);}
  .sub{margin-top:18px;font-size:21px;line-height:1.4;color:#EADFCB;max-width:560px;font-weight:500;}
  .sub b{color:#fff;font-weight:700;}
  .spacer{flex:1;}
  .bottom{display:flex;align-items:center;gap:22px;}
  .pill{background:var(--terra);color:#fff;font-weight:700;font-size:21px;padding:16px 30px;border-radius:999px;box-shadow:0 10px 22px rgba(191,80,40,.4);}
  .founder{font-size:17px;color:#EADFCB;font-weight:600;line-height:1.3;}
  .founder b{color:var(--oro-lt);}
  /* columna derecha: emblema grande */
  .right{position:relative;z-index:2;width:380px;display:flex;align-items:center;justify-content:center;}
  .right::before{content:"";position:absolute;width:520px;height:520px;right:-120px;
    background:radial-gradient(closest-side, rgba(197,155,28,.30), transparent 70%);}
  .emblem{width:300px;height:300px;position:relative;z-index:2;filter:drop-shadow(0 18px 36px rgba(0,0,0,.4));}
</style>
</head>
<body>
  <div class="card">
    <div class="left">
      <div class="brand">
        <svg class="mark" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <circle cx="16" cy="16" r="15.5" fill="#20362A"/>
          <circle cx="16" cy="16" r="12.4" fill="none" stroke="#E7C65A" stroke-width="1" stroke-opacity="0.9"/>
          <g transform="translate(3.4,4) scale(0.78)">
            <path d="M2,16 C3,8.5 9,3.5 16,3.5 C23,3.5 29,8.5 30,16 Z" fill="#3F6B4B"/>
            <path d="M8,18.4 L24,18.4 L28,26.6 L4,26.6 Z" fill="#CBBBA0"/>
            <rect x="7.6" y="12.9" width="16.8" height="5.6" fill="#BBAA8D"/>
            <rect x="9.4" y="14.2" width="2.4" height="4.3" fill="#33281D"/>
            <rect x="20.2" y="14.2" width="2.4" height="4.3" fill="#33281D"/>
            <path d="M14,18.5 L14,14.6 C14,13.6 14.9,13.1 16,13.1 C17.1,13.1 18,13.6 18,14.6 L18,18.5 Z" fill="#2A2016"/>
            <path d="M16,3.2 C18.4,6.8 22,10.6 25,12.9 L7,12.9 C10,10.6 13.6,6.8 16,3.2 Z" fill="#E7C65A"/>
          </g>
        </svg>
        <div class="wm">en<b>malinalco</b>.com</div>
      </div>
      <div class="eyebrow">El directorio del pueblo</div>
      <h1 class="headline">Que te encuentren donde <em>ya te buscan.</em></h1>
      <p class="sub">Miles de visitantes buscan cada fin de semana <b>dónde comer, dormir y qué hacer</b> en Malinalco.</p>
      <div class="spacer"></div>
      <div class="bottom">
        <div class="pill">Anúnciate hoy →</div>
        <div class="founder"><b>Programa Fundadores:</b> 30% de descuento<br>tus 3 primeros meses · 50 cupos · sin permanencia</div>
      </div>
    </div>
    <div class="right">
      <svg class="emblem" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <circle cx="16" cy="16" r="15.5" fill="#20362A"/>
        <circle cx="16" cy="16" r="12.4" fill="none" stroke="#E7C65A" stroke-width="0.9" stroke-opacity="0.9"/>
        <g transform="translate(3.4,4) scale(0.78)">
          <path d="M2,16 C3,8.5 9,3.5 16,3.5 C23,3.5 29,8.5 30,16 Z" fill="#3F6B4B"/>
          <path d="M8,18.4 L24,18.4 L28,26.6 L4,26.6 Z" fill="#CBBBA0"/>
          <path d="M6.6,24.3 L25.4,24.3 M7.5,22 L24.5,22 M8.4,19.9 L23.6,19.9" stroke="#9A8A6E" stroke-width="0.7" stroke-linecap="round"/>
          <rect x="7.6" y="12.9" width="16.8" height="5.6" fill="#BBAA8D"/>
          <rect x="9.4" y="14.2" width="2.4" height="4.3" fill="#33281D"/>
          <rect x="20.2" y="14.2" width="2.4" height="4.3" fill="#33281D"/>
          <path d="M14,18.5 L14,14.6 C14,13.6 14.9,13.1 16,13.1 C17.1,13.1 18,13.6 18,14.6 L18,18.5 Z" fill="#2A2016"/>
          <path d="M16,3.2 C18.4,6.8 22,10.6 25,12.9 L7,12.9 C10,10.6 13.6,6.8 16,3.2 Z" fill="#E7C65A"/>
          <path d="M8.8,11.6 Q16,8.8 23.2,11.6 M10.4,9.6 Q16,7.4 21.6,9.6 M12,7.7 Q16,6.2 20,7.7" stroke="#B0863A" stroke-width="0.55" fill="none"/>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
